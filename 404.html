<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#f2f0e9" />
    <title>Record Not Found / Direction and Design</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/script.js"></script>
  </head>
  <body data-page="404">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="page-masthead">
      <a class="wordmark" href="/">
        <img
          src="/assets/identity/direction-design-master-logo.svg"
          alt="Direction and Design"
          width="36"
          height="24"
        />
        <span aria-hidden="true">Direction and Design</span>
      </a>
      <p>System notice</p>
      <p>Error / 404</p>
      <a class="inline-action" href="/">
        <span>Return to index</span>
        <img src="/assets/ui/arrow-up-right.svg" alt="" aria-hidden="true" />
      </a>
    </header>

    <main id="main-content" class="page-shell error-page">
      <p class="error-code" aria-hidden="true">404</p>
      <div>
        <p class="folio-label">Record unavailable</p>
        <h1>This route is not in the registry.</h1>
        <p>
          Return to the main index or continue through the complete work register.
        </p>
        <div class="error-actions">
          <a class="button-link" href="/">Index</a>
          <a class="button-link" href="/work/">Work registry</a>
        </div>
      </div>
    </main>

    <footer class="terminal-identity" aria-hidden="true">
      <img
        src="/assets/identity/direction-design-master-logo.svg"
        alt=""
        width="52"
        height="35"
      />
    </footer>

    <nav class="site-navigation" aria-label="Primary">
      <a href="/"><span>Index</span><small>00</small></a>
      <a href="/timeline/"><span>Timeline</span><small>01</small></a>
      <a href="/practices/"><span>Practices</span><small>02</small></a>
      <a href="/about/"><span>About</span><small>03</small></a>
      <a href="/contact/"><span>Contact</span><small>04</small></a>
    </nav>
  </body>
</html>
